  <circle cx="400" cy="250" r="260" fill="#1b4332" opacity="0.25"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="50" y1="100" x2="750" y2="100"/>
    <line x1="50" y1="200" x2="750" y2="200"/>
    <line x1="50" y1="300" x2="750" y2="300"/>
    <line x1="50" y1="400" x2="750" y2="400"/>
  </g>

  <!-- Top bar UI -->
  <rect x="50" y="40" width="700" height="48" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="75" cy="64" r="6" fill="#ef4444" opacity="0.7"/>
  <circle cx="95" cy="64" r="6" fill="#f59e0b" opacity="0.7"/>
  <circle cx="115" cy="64" r="6" fill="#10b981" opacity="0.7"/>
